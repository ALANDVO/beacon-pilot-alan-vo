# CI Workflow for beacon-pilot-alan-vo
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DEBUG: "true"
          ENVIRONMENT: "test"
          SECRET_KEY: "test-secret"
          OIDC_ENABLED: "false"

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run build 2>&1 | head -50

      - name: Run frontend tests
        run: pnpm test --run

  backend-build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: beacon-pilot-backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: beacon-pilot-frontend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d backend
          # Wait for backend to be healthy
          for i in {1..30}; do
            if docker compose exec -T backend python -c "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()" 2>/dev/null; then
              echo "Backend is healthy"
              break
            fi
            sleep 2
          done

      - name: Test API endpoints
        run: |
          # Test health endpoint
          curl -f http://localhost:8000/health
          
          # Test memory creation
          curl -f -X POST http://localhost:8000/memories \
            -H "Content-Type: application/json" \
            -d '{"document_id": "test-doc", "content": "Test memory", "tags": ["test"]}'
          
          # Test memory listing
          curl -f http://localhost:8000/memories

      - name: Cleanup
        if: always()
        run: docker compose down -v