[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-pilot-alan-vo"
version = "1.0.0"
description = "Agent Memory That Learns - Local-first memory system for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
  {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = [
  "ai",
  "machine-learning",
  "agent-memory",
  "long-term-memory",
  "consolidation",
  "extraction"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.1",
  "pydantic-settings==2.6.1",
  "python-jose[cryptography]==3.3.0",
  "python-multipart==0.0.9",
  "httpx==0.27.2",
  "python-dotenv==1.0.1",
  "alembic==1.13.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.23.7",
  "httpx==0.27.2",
  "fakeredis==2.21.1",
  "ruff==0.5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "ARG"]
ignore = ["E501", "ARG001", "ARG002"]